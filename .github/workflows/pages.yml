name: Publicar informe
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verificar-y-generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -c "import nbformat; nbformat.validate(nbformat.read('Rosero_Samuel_Rico_Braian_Analizando_EA1.ipynb', as_version=4))"
      - run: python -m unittest discover -s tests -v
      - run: jupyter nbconvert --to html --output index --output-dir _site Rosero_Samuel_Rico_Braian_Analizando_EA1.ipynb
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  desplegar:
    needs: verificar-y-generar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
