name: Integración continua
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validar notebook
        run: python -c "import nbformat; nbformat.validate(nbformat.read('Rosero_Samuel_Rico_Braian_Analizando_EA1.ipynb', as_version=4))"
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v
      - name: Comprobar generación del informe
        run: jupyter nbconvert --to html --output index --output-dir _site Rosero_Samuel_Rico_Braian_Analizando_EA1.ipynb
